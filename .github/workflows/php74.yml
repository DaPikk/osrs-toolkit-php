name: PHP 7.4 Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: PHP 7.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, openssl
          coverage: none
          tools: composer:v2

      - name: Show environment
        run: |
          php -v
          composer --version

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Verify dependency compatibility
        run: |
          composer update \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Check Composer platform requirements
        run: composer check-platform-reqs --no-dev

      - name: PHP syntax check
        run: |
          find opensrs \
            -type f \
            -name '*.php' \
            -print0 \
            | xargs -0 -n1 php -l
